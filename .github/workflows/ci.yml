name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # rustfmt needs no build artifacts, so gate on it before paying the
      # restore/save cost of a ~450 MB cache entry.
      - name: Check formatting
        run: cargo fmt --check

      - uses: Swatinem/rust-cache@v2
        with:
          # Share one cache with the publish workflow instead of keying per job.
          shared-key: rust-ci
          # Only the default branch writes the cache. PR branches restore from
          # it but never save, so short-lived branches can't evict main's entry
          # against the 10 GB per-repo cache cap.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Clippy/test failures are the common case on a red main; without
          # this the compile work is discarded and the next run starts cold.
          cache-on-failure: true

      - name: Clippy
        run: cargo clippy --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features
