name: Publish to crates.io

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if version changed
        id: version
        run: |
          CURRENT=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          PREVIOUS=$(git show HEAD~1:Cargo.toml 2>/dev/null | grep '^version' | head -1 | sed 's/.*"\(.*\)"/\1/' || echo "")
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" != "$PREVIOUS" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if version already published
        if: steps.version.outputs.changed == 'true'
        id: check_published
        run: |
          VERSION="${{ steps.version.outputs.current }}"
          if cargo search pique --limit 1 2>/dev/null | grep -q "pique = \"$VERSION\""; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.version.outputs.changed == 'true' && steps.check_published.outputs.already_published != 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.version.outputs.changed == 'true' && steps.check_published.outputs.already_published != 'true'

      - name: Run tests
        if: steps.version.outputs.changed == 'true' && steps.check_published.outputs.already_published != 'true'
        run: cargo test --all-features

      - name: Publish to crates.io
        if: steps.version.outputs.changed == 'true' && steps.check_published.outputs.already_published != 'true'
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Create git tag and GitHub Release
        if: steps.version.outputs.changed == 'true' && steps.check_published.outputs.already_published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v${{ steps.version.outputs.current }}"
          git tag "$VERSION"
          git push origin "$VERSION"
          gh release create "$VERSION" --generate-notes
